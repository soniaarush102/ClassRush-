name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Force Clean & Regenerate Modern v2 Android Scaffolding
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Configure Gradle 9.3.1, MultiDex, and Disable Minification for Jitsi
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          python3 -c '
          import os, re

          # 1. Create and configure gradle-wrapper.properties for Gradle 9.3.1
          gw_dir = "android/gradle/wrapper"
          os.makedirs(gw_dir, exist_ok=True)
          gw_path = os.path.join(gw_dir, "gradle-wrapper.properties")
          
          gw_content = """distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          """
          with open(gw_path, "w", encoding="utf-8") as f:
              f.write(gw_content)

          # 2. Patch build.gradle for SDK 34, MinSDK 24, MultiDex, and disable minification
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g_content = f.read()

              g_content = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", g_content)
              g_content = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", g_content)
              g_content = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g_content)
              
              g_content = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 34", g_content)
              g_content = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 34", g_content)
              g_content = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 34", g_content)
              
              g_content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", g_content)
              g_content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", g_content)
              g_content = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 34", g_content)

              if "multiDexEnabled" not in g_content:
                  g_content = re.sub(r"(defaultConfig\s*\{)", r"\1\n        multiDexEnabled true", g_content)

              # Disable minification/shrinking in buildTypes release so Jitsi classes are preserved
              if "minifyEnabled" in g_content:
                  g_content = re.sub(r"minifyEnabled\s+true", "minifyEnabled false", g_content)
              else:
                  g_content = re.sub(r"(buildTypes\s*\{[^}]*release\s*\{)", r"\1\n            minifyEnabled false\n            shrinkResources false", g_content)

              if "androidx.multidex:multidex" not in g_content:
                  g_content += "\n\ndependencies {\n    implementation '\''androidx.multidex:multidex:2.0.1'\''\n}\n"

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(g_content)
          '

      - name: Build Android App Bundle
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          
