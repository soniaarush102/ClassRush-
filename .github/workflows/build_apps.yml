name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Ensure Android v2 Embedding & MinSDK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          echo "Patching Android configuration for Jitsi Meet & v2 embedding..."
          
          # 1. Update AndroidManifest.xml for v2 embedding
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="android.app.Application"/g' "$MANIFEST_PATH"
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \    <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST_PATH"
            fi
            echo "AndroidManifest patched successfully."
          fi

          # 2. Ensure minSdkVersion is at least 24 (required by Jitsi Meet)
          GRADLE_PATH="android/app/build.gradle"
          if [ -f "$GRADLE_PATH" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' "$GRADLE_PATH"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$GRADLE_PATH"
            echo "Updated minSdkVersion to 24 in build.gradle."
          fi

          # 3. Patch MainActivity imports
          find android -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r file; do
            sed -i 's/import io.flutter.app.FlutterActivity/import io.flutter.embedding.android.FlutterActivity/g' "$file"
            echo "Patched MainActivity at $file"
          done

      - name: Build Android APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
