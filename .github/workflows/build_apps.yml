name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Flutter project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: flutter pub get

      - name: Build Android APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.find-project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk

   <meta-data
    android:name="flutterEmbedding"
    android:value="2" />
    
