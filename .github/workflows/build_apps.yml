name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Clean and Regenerate Fresh Android Scaffolding
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Upgrade Gradle Wrapper & Surgically Patch build.gradle
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          python3 -c '
          import os, re

          # 1. Upgrade Gradle wrapper to 8.4
          gw_path = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw_path):
              with open(gw_path, "r", encoding="utf-8") as f:
                  gw_content = f.read()
              gw_content = re.sub(
                  r"distributionUrl=.*", 
                  r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip", 
                  gw_content
              )
              with open(gw_path, "w", encoding="utf-8") as f:
                  f.write(gw_content)

          # 2. Surgically patch build.gradle
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g_content = f.read()

              # Update SDK versions safely
              g_content = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", g_content)
              g_content = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", g_content)
              g_content = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g_content)
              
              g_content = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 34", g_content)
              g_content = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 34", g_content)
              g_content = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 34", g_content)
              
              g_content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 34", g_content)
              g_content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", g_content)
              g_content = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 34", g_content)

              # Enable MultiDex inside defaultConfig
              if "multiDexEnabled" not in g_content:
                  g_content = re.sub(r"(defaultConfig\s*\{)", r"\1\n        multiDexEnabled true", g_content)

              # Add MultiDex dependency
              if "androidx.multidex:multidex" not in g_content:
                  g_content += "\n\ndependencies {\n    implementation '\''androidx.multidex:multidex:2.0.1'\''\n}\n"

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(g_content)
          '

      - name: Build Android APK and Capture Error Output
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          flutter build apk --release --no-pub > build_output.log 2>&1 || {
            echo "========== BUILD FAILED. FULL LOG OUTPUT =========="
            cat build_output.log
            echo "=================================================="
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
