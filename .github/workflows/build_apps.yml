name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Clean and Regenerate Fresh Android Scaffolding
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Upgrade Gradle Wrapper & Write Production build.gradle
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          python3 -c '
          import os, re

          # 1. Upgrade Gradle wrapper to 8.4
          gw_path = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw_path):
              with open(gw_path, "r", encoding="utf-8") as f:
                  gw_content = f.read()
              gw_content = re.sub(
                  r"distributionUrl=.*", 
                  r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip", 
                  gw_content
              )
              with open(gw_path, "w", encoding="utf-8") as f:
                  f.write(gw_content)

          # 2. Write a complete, valid build.gradle with MultiDex and SDK 34
          gradle_path = "android/app/build.gradle"
          gradle_content = """
          plugins {
              id \"com.android.application\"
              id \"kotlin-android\"
              id \"dev.flutter.flutter-gradle-plugin\"
          }

          android {
              namespace \"com.example.classrush\"
              compileSdk 34
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '\''1.8'\''
              }

              defaultConfig {
                  applicationId \"com.example.classrush\"
                  minSdk 24
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source \"../..\"
          }

          dependencies {
              implementation '\''androidx.multidex:multidex:2.0.1'\''
          }
          """
          
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle_content)
          print("Successfully generated production build.gradle with MultiDex.")
          '

      - name: Build Android APK with Stacktrace
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter build apk --release --no-pub --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
