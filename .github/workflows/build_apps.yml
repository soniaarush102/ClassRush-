name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Global Recursive v2 Embedding & MinSDK Patch
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          python3 -c '
          import os, re

          # 1. Recursively patch all AndroidManifest.xml files in project & packages
          for root, dirs, files in os.walk("."):
              if ".git" in root or ".dart_tool" in root:
                  continue
              for file in files:
                  if file == "AndroidManifest.xml":
                      m_path = os.path.join(root, file)
                      try:
                          with open(m_path, "r", encoding="utf-8") as f:
                              content = f.read()
                          
                          changed = False
                          if "io.flutter.app.FlutterApplication" in content:
                              content = content.replace("io.flutter.app.FlutterApplication", "android.app.Application")
                              changed = True
                          if "flutterEmbedding" not in content and "<application" in content:
                              content = content.replace("<application", "<application>\n    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />")
                              changed = True
                              
                          if changed:
                              with open(m_path, "w", encoding="utf-8") as f:
                                  f.write(content)
                              print(f"Patched manifest: {m_path}")
                      except Exception as e:
                          pass

          # 2. Patch build.gradle for minSdkVersion 24
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g_content = f.read()
              g_content = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", g_content)
              g_content = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g_content)
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(g_content)
              print("Updated minSdkVersion to 24.")
          '

      - name: Build Android APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
