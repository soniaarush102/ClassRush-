name: Build ClassRush Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 4 | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Ensure Android v2 Embedding
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="android.app.Application"/g' "$MANIFEST_PATH"
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \ \ \ \ <meta-data\n\tandroid:name="flutterEmbedding"\n\tandroid:value="2" \/>' "$MANIFEST_PATH"
            fi
            echo "AndroidManifest patched."
          fi

          # Patch MainActivity to ensure v2 embedding inheritance
          for MAIN_ACTIVITY in android/app/src/main/kotlin/**/MainActivity.kt android/app/src/main/java/**/MainActivity.java; do
            if [ -f "$MAIN_ACTIVITY" ]; then
              sed -i 's/import io.flutter.app.FlutterActivity/import io.flutter.embedding.android.FlutterActivity/g' "$MAIN_ACTIVITY"
              echo "Patched MainActivity at $MAIN_ACTIVITY"
            fi
          done

      - name: Build Android APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
